<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CoolSchool — kid-safe Lehrplan 21 practice for Zyklus 1–2. No login, no ads.">
  <meta name="theme-color" content="#7EC8E3">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CoolSchool">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>CoolSchool</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: linear-gradient(#7EC8E3, #FFF3C4);
      font-family: system-ui, sans-serif;
    }
    .boot {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2D3142;
      font-size: 28px;
      font-weight: 700;
    }
    /* Real DOM banner so the hold is visible even if CanvasKit skips a frame. */
    #coolschool-answer-feedback {
      position: fixed;
      top: 68px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2147483647;
      box-sizing: border-box;
      width: min(92vw, 640px);
      padding: 16px 22px;
      border-radius: 22px;
      border: 4px solid #1B6B30;
      color: #fff;
      font-size: 36px;
      font-weight: 800;
      line-height: 1.2;
      text-align: center;
      pointer-events: none;
      box-shadow: 0 8px 24px rgba(45, 49, 66, 0.28);
    }
    #coolschool-answer-feedback[data-correct="true"] {
      background: #2FA84A;
      border-color: #1B6B30;
    }
    #coolschool-answer-feedback[data-correct="false"] {
      background: #E53935;
      border-color: #9B1B1B;
    }
  </style>
</head>
<body>
  <div class="boot">CoolSchool…</div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
